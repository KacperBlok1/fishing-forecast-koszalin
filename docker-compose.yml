services:
  fishing-forecast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fishing-forecast
    ports:
      - "${APP_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
